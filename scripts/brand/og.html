<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Source for src/app/opengraph-image.png (1200x630). Rendered by scripts/brand/render.mjs. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Rye&family=IM+Fell+English:ital@0;1&family=Special+Elite&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: #e9dcc0 url(../../public/textures/paper.webp);
        background-size: 512px;
        color: #2a2118;
        position: relative;
        font-family: "IM Fell English", Georgia, serif;
      }
      body::after {
        content: "";
        position: absolute;
        inset: 0;
        box-shadow:
          inset 0 0 90px rgba(92, 58, 33, 0.45),
          inset 0 0 18px rgba(92, 58, 33, 0.35);
        pointer-events: none;
      }
      .text {
        position: absolute;
        left: 72px;
        top: 96px;
        width: 560px;
      }
      h1 {
        font-family: Rye, Georgia, serif;
        font-weight: 400;
        font-size: 70px;
        line-height: 1.05;
        letter-spacing: 0.02em;
        margin: 0;
        text-transform: uppercase;
      }
      .role {
        font-size: 38px;
        margin-top: 26px;
      }
      .avail {
        font-size: 28px;
        font-style: italic;
        margin-top: 14px;
        color: #5a4a38;
      }
      .url {
        position: absolute;
        left: 72px;
        bottom: 64px;
        font-family: "Special Elite", monospace;
        font-size: 26px;
      }
      .stamp {
        position: absolute;
        left: 470px;
        bottom: 52px;
        font-family: Rye, serif;
        font-size: 26px;
        letter-spacing: 0.02em;
        color: #8e1b1b;
        border: 3px solid #8e1b1b;
        padding: 8px 16px;
        rotate: -6deg;
        text-transform: uppercase;
        mix-blend-mode: multiply;
        opacity: 0.9;
      }
      .stamp::before {
        content: "";
        position: absolute;
        inset: 3px;
        border: 1px solid #8e1b1b;
      }
      .plate {
        position: absolute;
        right: 56px;
        top: 70px;
        width: 470px;
        padding: 14px 14px 40px;
        background: #f3ead6 url(../../public/textures/paper.webp);
        background-size: 512px;
        rotate: 1.4deg;
        box-shadow:
          0 2px 2px rgba(42, 33, 24, 0.16),
          0 16px 26px -10px rgba(42, 33, 24, 0.5);
      }
      .plate img {
        display: block;
        width: 100%;
        height: 330px;
        object-fit: cover;
        object-position: 62% 60%;
        mix-blend-mode: multiply;
        filter: sepia(0.35);
      }
      .plate p {
        margin: 10px 2px 0;
        font-size: 17px;
        font-style: italic;
        color: #5a4a38;
      }
      .pin {
        position: absolute;
        top: -7px;
        left: 50%;
        width: 16px;
        height: 16px;
        margin-left: -8px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #f3ead6 0,
          #b08d57 38%,
          #5c3a21 100%
        );
        box-shadow: 1px 2px 2px rgba(42, 33, 24, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="text">
      <h1>Bodruddoza Araf</h1>
      <div class="role">Full-Stack and AI/ML Engineer</div>
      <div class="avail">Graduating October 2026, available full time.</div>
    </div>
    <div class="url">bodruddozaaraf.me</div>
    <div class="stamp">Wanted</div>
    <div class="plate">
      <span class="pin"></span
      ><img src="../../public/engravings/camping-out-adirondacks.webp" alt="" />
      <p>after Winslow Homer, 1874</p>
    </div>
  </body>
</html>
