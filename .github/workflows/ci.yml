# Every pull request and every push to main: the same checks as the pre-merge list in CLAUDE.md,
# then the Playwright smoke tests against the production build (docs/04-architecture.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24 ships npm 11, which wrote package-lock.json; npm 10 (Node 22) rejects it
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Lint and copy check
        run: npm run lint

      - name: Unit checks
        run: npm test

      - name: Formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke tests
        run: npm run test:e2e

      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
